site_name: Baserow developer docs
site_description: Onboarding and technical documentation for Baserow developers.
docs_dir: docs
site_dir: site

# Default port for `mkdocs serve`. 8000 is the backend, 8001 is used by SaaS,
# 7999 and 4000 are taken by OrbStack on dev machines. Override with
# `just docs serve -a 127.0.0.1:<other>` if 9000 clashes for you.
dev_addr: 127.0.0.1:9000

