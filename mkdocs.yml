theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      # Custom Baserow blues are set in stylesheets/baserow.css.
      # `custom` keeps Material from applying its built-in palette over them.
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    # navigation.instant intentionally disabled: it intercepts page loads via
    # XHR and breaks `mkdocs serve` live-reload (the current page stays
    # cached even after a rebuild). The production-nav speed win isn't worth
    # the dev-loop pain. Re-enable when we add a CI build of the site.
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/baserow.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

# Custom build-time hooks. See docs_hooks/ for what each one does.
hooks:
  - docs_hooks/skills_index.py

# Extra directories that `mkdocs serve` watches for live-reload.
# `docs_dir` itself is always watched; these are the out-of-tree paths
# our content depends on so that editing a SKILL.md or a hook re-renders.
watch:
  - .agents/skills
  - docs_hooks
