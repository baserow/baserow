
<VirtualHost *:80>
ProxyPreserveHost On

# Replace with your sub domain
ServerName example.localhost

# Serve user uploaded files with download and sandboxing headers.
RewriteRule ^/media/.* - [E=IS_MEDIA:1]
RewriteCond %{QUERY_STRING} (?:^|&)dl=([^&]+)
RewriteRule ^/media/.* - [E=FILENAME:%1]
Header set "Content-Disposition" "attachment; filename=\"%{FILENAME}e\"" env=FILENAME
Header set "X-Content-Type-Options" "nosniff" env=IS_MEDIA
Header set "Content-Security-Policy" "sandbox; default-src 'none'; script-src 'none'; object-src 'none'; base-uri 'none'" env=IS_MEDIA
ProxyPass /media !
Alias /media /baserow/media
<Directory "/baserow/media/">
    Require all granted
</Directory>


# Properly upgrade ws connections made by Baserow to the /ws path for realtime collab.
RewriteEngine on
RewriteCond ${HTTP:Upgrade} websocket [NC]
RewriteCond ${HTTP:Connection} upgrade [NC]
RewriteRule .* "ws://backend:8000/$1" [P,L,END]
ProxyPass /ws ws://backend:8000/ws
ProxyPassReverse /ws ws://backend:8000/ws

ProxyPass /api http://backend:8000/api
ProxyPassReverse /api http://backend:8000/api

# Route OAuth consent page to frontend before matching /mcp (ProxyPass uses prefix matching)
ProxyPass /mcp-authorize http://web-frontend:3000/mcp-authorize
ProxyPassReverse /mcp-authorize http://web-frontend:3000/mcp-authorize

ProxyPass /mcp http://backend:8000/mcp
ProxyPassReverse /mcp http://backend:8000/mcp

ProxyPass /oauth http://backend:8000/oauth
ProxyPassReverse /oauth http://backend:8000/oauth

ProxyPass /.well-known/oauth-authorization-server http://backend:8000/.well-known/oauth-authorization-server
ProxyPassReverse /.well-known/oauth-authorization-server http://backend:8000/.well-known/oauth-authorization-server

ProxyPass /.well-known/oauth-protected-resource http://backend:8000/.well-known/oauth-protected-resource
ProxyPassReverse /.well-known/oauth-protected-resource http://backend:8000/.well-known/oauth-protected-resource

ProxyPass /assistant http://backend:8000/assistant
ProxyPassReverse /assistant http://backend:8000/assistant

ProxyPass / http://web-frontend:3000/
ProxyPassReverse / http://web-frontend:3000/

</VirtualHost>
