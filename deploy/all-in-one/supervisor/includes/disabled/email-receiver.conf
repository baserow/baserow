# Receives inbound email for the "Start workflow by email" automation trigger
# and forwards it to the backend. Enabled by start.sh when
# BASEROW_INBOUND_EMAIL_DOMAIN and BASEROW_INBOUND_EMAIL_WEBHOOK_SECRET are
# set. Runs as root because mox binds its sockets (including privileged port
# 25) as root and then drops privileges itself.
[program:emailreceiver]
user=root
directory=/baserow/backend
command=/baserow/supervisor/wrapper.sh CYAN EMAIL_RECEIVER ./docker/docker-entrypoint.sh %(ENV_BASEROW_EMAIL_RECEIVER_STARTUP_COMMAND)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0
autostart=true
priority=2
startretries=3
startsecs=30
