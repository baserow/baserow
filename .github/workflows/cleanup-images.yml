name: Cleanup Old CI Images

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ${{ github.repository }}
  CI_IMAGE_TAG_PREFIX: ci-

jobs:
  cleanup-old-images:
    name: Cleanup Old CI Images
    runs-on: ubicloud-standard-2
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old CI images
        run: |
          # Function to delete old versions of a package
          delete_old_versions() {
            local package_name=$1
            local keep_count=${2:-10}

            echo "Processing package: $package_name"

            # Get all versions with ci- prefix, sorted by creation date
            versions=$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/orgs/${{ github.repository_owner }}/packages/container/$package_name/versions?per_page=100" \
              --jq '.[] | select(.metadata.container.tags[] | startswith("ci-")) | {id: .id, created_at: .created_at, tags: .metadata.container.tags} | @json' \
              2>/dev/null || echo "")

            if [ -z "$versions" ]; then
              echo "No CI images found for $package_name"
              return
            fi

            # Sort by creation date and skip the most recent ones
            versions_to_delete=$(echo "$versions" | jq -r -s "sort_by(.created_at) | reverse | .[${keep_count}:] | .[] | .id")

            deleted_count=0
            for version_id in $versions_to_delete; do
              echo "Deleting version ID: $version_id from $package_name"
              gh api \
                --method DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/orgs/${{ github.repository_owner }}/packages/container/$package_name/versions/$version_id" \
                2>/dev/null && ((deleted_count++)) || echo "Failed to delete version $version_id"
            done

            echo "Deleted $deleted_count old versions of $package_name"
          }

          # Cleanup backend_dev images (keep last 10)
          delete_old_versions "$(echo ${{ env.IMAGE_REPO }} | tr '[:upper:]' '[:lower:]')/backend_dev" 10

          # Cleanup web-frontend_dev images (keep last 10)
          delete_old_versions "$(echo ${{ env.IMAGE_REPO }} | tr '[:upper:]' '[:lower:]')/web-frontend_dev" 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete untagged images
        run: |
          # Function to delete untagged versions
          delete_untagged() {
            local package_name=$1

            echo "Deleting untagged versions of: $package_name"

            # Get all untagged versions
            untagged_versions=$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/orgs/${{ github.repository_owner }}/packages/container/$package_name/versions?per_page=100" \
              --jq '.[] | select(.metadata.container.tags | length == 0) | .id' \
              2>/dev/null || echo "")

            if [ -z "$untagged_versions" ]; then
              echo "No untagged images found for $package_name"
              return
            fi

            deleted_count=0
            for version_id in $untagged_versions; do
              echo "Deleting untagged version ID: $version_id"
              gh api \
                --method DELETE \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/orgs/${{ github.repository_owner }}/packages/container/$package_name/versions/$version_id" \
                2>/dev/null && ((deleted_count++)) || echo "Failed to delete version $version_id"
            done

            echo "Deleted $deleted_count untagged versions of $package_name"
          }

          # Cleanup untagged images
          delete_untagged "$(echo ${{ env.IMAGE_REPO }} | tr '[:upper:]' '[:lower:]')/backend_dev"
          delete_untagged "$(echo ${{ env.IMAGE_REPO }} | tr '[:upper:]' '[:lower:]')/web-frontend_dev"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup summary
        run: |
          echo "✅ Cleanup completed successfully"
          echo "- Kept the 10 most recent CI images for each package"
          echo "- Removed all untagged images"
          echo "- CI images are tagged with prefix: ${{ env.CI_IMAGE_TAG_PREFIX }}"
