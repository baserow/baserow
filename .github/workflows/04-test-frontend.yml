name: Test Web-Frontend

on:
  workflow_run:
    workflows: ["Lint"]
    types:
      - completed
    branches:
      - '**'

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ${{ github.repository }}
  CI_IMAGE_TAG_PREFIX: ci-

jobs:
  # Run web-frontend tests
  test:
    name: Web-Frontend Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Get commit SHA from triggering workflow
        id: commit
        run: |
          echo "sha=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run web-frontend tests
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_REPO }}/web-frontend_dev:${{ env.CI_IMAGE_TAG_PREFIX }}${{ steps.commit.outputs.sha }}"
          mkdir -p reports

          # Run tests in Docker container and capture output
          docker run \
            --name=webfrontend_test \
            $IMAGE ci-test | tee reports/stdout.txt

          # Copy test reports from container
          docker cp webfrontend_test:/baserow/reports ./reports
          docker rm webfrontend_test

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-frontend-test-reports
          path: reports/
          retention-days: 7

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: reports/junit.xml
          check_name: Web-Frontend Tests
