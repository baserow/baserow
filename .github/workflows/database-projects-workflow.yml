name: Update Database Team Project Fields

on:
  issues:
    types: [labeled, opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: number

jobs:
  update-project-fields:
    runs-on: ubuntu-latest
    steps:
      - name: Get Issue Data (for manual trigger)
        if: github.event_name == 'workflow_dispatch'
        id: get-issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.inputs.issue_number }}
            });
            return issue.data;

      - name: Get Project Data
        id: get-project
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DATABASE_PROJECT_WORKFLOW_TOKEN }}
          script: |
            const projectNumber = 3;
            const owner = context.repo.owner;

            // Get project ID
            const projectQuery = `
              query($owner: String!, $number: Int!) {
                organization(login: $owner) {
                  projectV2(number: $number) {
                    id
                  }
                }
              }
            `;

            const projectData = await github.graphql(projectQuery, {
              owner,
              number: projectNumber
            });

            return projectData.organization.projectV2;

      - name: Add Issue to Project on Label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DATABASE_PROJECT_WORKFLOW_TOKEN }}
          script: |
            const projectData = ${{ steps.get-project.outputs.result }};

            // Get issue data based on trigger type
            const issue = github.event_name === 'workflow_dispatch'
              ? ${{ steps.get-issue.outputs.result }}
              : context.payload.issue;

            // Check if issue has required labels
            const hasRequiredLabel = issue.labels.some(label =>
              label.name.startsWith('domain::database') || label.name.startsWith('domain::core')
            );

            if (!hasRequiredLabel) {
              console.log('Issue does not have required labels (domain::database or domain::core)');
              return;
            }

            const issueNodeId = issue.node_id;

            // Check if issue is already in project
            const checkQuery = `
              query($issueId: ID!) {
                node(id: $issueId) {
                  ... on Issue {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project { id }
                      }
                    }
                  }
                }
              }
            `;

            const checkData = await github.graphql(checkQuery, { issueId: issueNodeId });
            const existingItem = checkData.node.projectItems.nodes.find(
              item => item.project.id === projectData.id
            );

            if (existingItem) {
              console.log('Issue is already in the project');
              return;
            }

            // Add issue to project
            const addMutation = `
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {
                  projectId: $projectId
                  contentId: $contentId
                }) {
                  item {
                    id
                  }
                }
              }
            `;

            await github.graphql(addMutation, {
              projectId: projectData.id,
              contentId: issueNodeId
            });

            console.log('Issue added to project');
