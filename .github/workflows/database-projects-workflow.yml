name: Update Database Team Project Fields

on:
  pull_request:
    types: [opened, ready_for_review, reopened, converted_to_draft]
  pull_request_review:
    types: [submitted]
  issues:
    types: [labeled, opened]

jobs:
  update-project-fields:
    runs-on: ubuntu-latest
    steps:
      - name: Get Project Data
        id: get-project
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        with:
          script: |
            const projectNumber = 3;
            const owner = context.repo.owner;

            // Get project ID and field IDs
            const projectQuery = `
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const projectData = await github.graphql(projectQuery, {
              owner,
              number: projectNumber
            });

            return projectData.user.projectV2;

      - name: Update PR Status on Creation
        if: github.event.action == 'opened'
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        with:
          script: |
            const projectData = ${{ steps.get-project.outputs.result }};
            const statusField = projectData.fields.nodes.find(f => f.name === 'Status');
            const inProgressOption = statusField.options.find(o => o.name === 'In Progress');

            // Get PR item ID in project
            const itemQuery = `
              query($prId: ID!) {
                node(id: $prId) {
                  ... on PullRequest {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project {
                          id
                        }
                      }
                    }
                    closingIssuesReferences(first: 10) {
                      nodes {
                        id
                        number
                        projectItems(first: 10) {
                          nodes {
                            id
                            project { id }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const prNodeId = context.payload.pull_request.node_id;
            const itemData = await github.graphql(itemQuery, { prId: prNodeId });

            const projectItem = itemData.node.projectItems.nodes.find(
              item => item.project.id === projectData.id
            );

            if (projectItem) {
              // Update PR to In Progress
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }) {
                    projectV2Item {
                      id
                    }
                  }
                }
              `, {
                projectId: projectData.id,
                itemId: projectItem.id,
                fieldId: statusField.id,
                optionId: inProgressOption.id
              });

              // Update linked issues to In Progress
              for (const issue of itemData.node.closingIssuesReferences.nodes) {
                const issueProjectItem = issue.projectItems.nodes.find(
                  item => item.project.id === projectData.id
                );

                if (issueProjectItem) {
                  await github.graphql(`
                    mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                      updateProjectV2ItemFieldValue(input: {
                        projectId: $projectId
                        itemId: $itemId
                        fieldId: $fieldId
                        value: { singleSelectOptionId: $optionId }
                      }) {
                        projectV2Item { id }
                      }
                    }
                  `, {
                    projectId: projectData.id,
                    itemId: issueProjectItem.id,
                    fieldId: statusField.id,
                    optionId: inProgressOption.id
                  });
                }
              }
            }

      - name: Update Status on Converted to Draft
        if: github.event.action == 'converted_to_draft'
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        with:
          script: |
            const projectData = ${{ steps.get-project.outputs.result }};
            const statusField = projectData.fields.nodes.find(f => f.name === 'Status');
            const inProgressOption = statusField.options.find(o => o.name === 'In Progress');

            // Get PR item ID and linked issues
            const itemQuery = `
              query($prId: ID!) {
                node(id: $prId) {
                  ... on PullRequest {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project { id }
                      }
                    }
                    closingIssuesReferences(first: 10) {
                      nodes {
                        id
                        number
                        projectItems(first: 10) {
                          nodes {
                            id
                            project { id }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const prNodeId = context.payload.pull_request.node_id;
            const itemData = await github.graphql(itemQuery, { prId: prNodeId });

            const projectItem = itemData.node.projectItems.nodes.find(
              item => item.project.id === projectData.id
            );

            if (projectItem) {
              // Update PR to In Progress
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }) {
                    projectV2Item { id }
                  }
                }
              `, {
                projectId: projectData.id,
                itemId: projectItem.id,
                fieldId: statusField.id,
                optionId: inProgressOption.id
              });

              // Update linked issues to In Progress
              for (const issue of itemData.node.closingIssuesReferences.nodes) {
                const issueProjectItem = issue.projectItems.nodes.find(
                  item => item.project.id === projectData.id
                );

                if (issueProjectItem) {
                  await github.graphql(`
                    mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                      updateProjectV2ItemFieldValue(input: {
                        projectId: $projectId
                        itemId: $itemId
                        fieldId: $fieldId
                        value: { singleSelectOptionId: $optionId }
                      }) {
                        projectV2Item { id }
                      }
                    }
                  `, {
                    projectId: projectData.id,
                    itemId: issueProjectItem.id,
                    fieldId: statusField.id,
                    optionId: inProgressOption.id
                  });
                }
              }
            }

      - name: Update Status on Ready for Review
        if: github.event.action == 'ready_for_review'
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        with:
          script: |
            const projectData = ${{ steps.get-project.outputs.result }};
            const statusField = projectData.fields.nodes.find(f => f.name === 'Status');
            const inReviewOption = statusField.options.find(o => o.name === 'In Review');

            // Update PR status
            const prNodeId = context.payload.pull_request.node_id;
            const itemQuery = `
              query($prId: ID!) {
                node(id: $prId) {
                  ... on PullRequest {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project { id }
                      }
                    }
                    closingIssuesReferences(first: 10) {
                      nodes {
                        id
                        number
                        projectItems(first: 10) {
                          nodes {
                            id
                            project { id }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const itemData = await github.graphql(itemQuery, { prId: prNodeId });
            const projectItem = itemData.node.projectItems.nodes.find(
              item => item.project.id === projectData.id
            );

            if (projectItem) {
              // Update PR to In Review
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }) {
                    projectV2Item { id }
                  }
                }
              `, {
                projectId: projectData.id,
                itemId: projectItem.id,
                fieldId: statusField.id,
                optionId: inReviewOption.id
              });
              
              // Check linked issues and update if all PRs are in review
              for (const issue of itemData.node.closingIssuesReferences.nodes) {
                const issueProjectItem = issue.projectItems.nodes.find(
                  item => item.project.id === projectData.id
                );
                
                if (issueProjectItem) {
                  // Get all PRs linked to this issue
                  const linkedPRsQuery = `
                    query($issueNumber: Int!, $owner: String!, $repo: String!) {
                      repository(owner: $owner, name: $repo) {
                        issue(number: $issueNumber) {
                          timelineItems(first: 100, itemTypes: CROSS_REFERENCED_EVENT) {
                            nodes {
                              ... on CrossReferencedEvent {
                                source {
                                  ... on PullRequest {
                                    id
                                    isDraft
                                    state
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  `;
                  
                  const linkedPRs = await github.graphql(linkedPRsQuery, {
                    issueNumber: issue.number,
                    owner: context.repo.owner,
                    repo: context.repo.repo
                  });
                  
                  const prs = linkedPRs.repository.issue.timelineItems.nodes
                    .map(n => n.source)
                    .filter(pr => pr && pr.state === 'OPEN');
                  
                  const allInReview = prs.every(pr => !pr.isDraft);
                  
                  if (allInReview && prs.length > 0) {
                    await github.graphql(`
                      mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                        updateProjectV2ItemFieldValue(input: {
                          projectId: $projectId
                          itemId: $itemId
                          fieldId: $fieldId
                          value: { singleSelectOptionId: $optionId }
                        }) {
                          projectV2Item { id }
                        }
                      }
                    `, {
                      projectId: projectData.id,
                      itemId: issueProjectItem.id,
                      fieldId: statusField.id,
                      optionId: inReviewOption.id
                    });
                  }
                }
              }
            }

      - name: Update Review Status on Review
        if: github.event_name == 'pull_request_review'
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        with:
          script: |
            const projectData = ${{ steps.get-project.outputs.result }};
            const reviewStatusField = projectData.fields.nodes.find(f => f.name === 'Review Status');

            if (!reviewStatusField) {
              console.log('Review Status field not found');
              return;
            }

            const reviewState = context.payload.review.state;
            let optionName;

            if (reviewState === 'changes_requested') {
              optionName = 'Unresolved Feedback';
            } else if (reviewState === 'approved') {
              optionName = 'Can Be Merged';
            } else {
              return; // Don't update for comments
            }

            const option = reviewStatusField.options.find(o => o.name === optionName);

            if (!option) {
              console.log(`Option ${optionName} not found`);
              return;
            }

            // Get PR item ID
            const prNodeId = context.payload.pull_request.node_id;
            const itemQuery = `
              query($prId: ID!) {
                node(id: $prId) {
                  ... on PullRequest {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project { id }
                      }
                    }
                  }
                }
              }
            `;

            const itemData = await github.graphql(itemQuery, { prId: prNodeId });
            const projectItem = itemData.node.projectItems.nodes.find(
              item => item.project.id === projectData.id
            );

            if (projectItem) {
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }) {
                    projectV2Item { id }
                  }
                }
              `, {
                projectId: projectData.id,
                itemId: projectItem.id,
                fieldId: reviewStatusField.id,
                optionId: option.id
              });
            }

      - name: Add Issue to Project on Label
        if: github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'domain::database') || contains(github.event.issue.labels.*.name, 'domain::core'))
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        with:
          script: |
            const projectData = ${{ steps.get-project.outputs.result }};
            const issueNodeId = context.payload.issue.node_id;

            // Check if issue is already in project
            const checkQuery = `
              query($issueId: ID!) {
                node(id: $issueId) {
                  ... on Issue {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project { id }
                      }
                    }
                  }
                }
              }
            `;

            const checkData = await github.graphql(checkQuery, { issueId: issueNodeId });
            const existingItem = checkData.node.projectItems.nodes.find(
              item => item.project.id === projectData.id
            );

            if (existingItem) {
              console.log('Issue is already in the project');
              return;
            }

            // Add issue to project
            const addMutation = `
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {
                  projectId: $projectId
                  contentId: $contentId
                }) {
                  item {
                    id
                  }
                }
              }
            `;

            await github.graphql(addMutation, {
              projectId: projectData.id,
              contentId: issueNodeId
            });

            console.log('Issue added to project');
