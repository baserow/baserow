name: Update Database Team Project Fields

on:
  issues:
    types: [labeled, opened]

jobs:
  update-project-fields:
    runs-on: ubuntu-latest
    steps:
      - name: Get Project Data
        id: get-project
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        with:
          script: |
            const projectNumber = 3;
            const owner = context.repo.owner;

            // Get project ID
            const projectQuery = `
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                  }
                }
              }
            `;

            const projectData = await github.graphql(projectQuery, {
              owner,
              number: projectNumber
            });

            return projectData.user.projectV2;

      - name: Add Issue to Project on Label
        if: github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'domain::database') || contains(github.event.issue.labels.*.name, 'domain::core'))
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        with:
          script: |
            const projectData = ${{ steps.get-project.outputs.result }};
            const issueNodeId = context.payload.issue.node_id;

            // Check if issue is already in project
            const checkQuery = `
              query($issueId: ID!) {
                node(id: $issueId) {
                  ... on Issue {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project { id }
                      }
                    }
                  }
                }
              }
            `;

            const checkData = await github.graphql(checkQuery, { issueId: issueNodeId });
            const existingItem = checkData.node.projectItems.nodes.find(
              item => item.project.id === projectData.id
            );

            if (existingItem) {
              console.log('Issue is already in the project');
              return;
            }

            // Add issue to project
            const addMutation = `
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {
                  projectId: $projectId
                  contentId: $contentId
                }) {
                  item {
                    id
                  }
                }
              }
            `;

            await github.graphql(addMutation, {
              projectId: projectData.id,
              contentId: issueNodeId
            });

            console.log('Issue added to project');
