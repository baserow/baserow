name: Update Database Project PR and Issue Status

on:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, review_requested]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to test'
        required: true
        type: number
      action:
        description: 'Action to simulate'
        required: true
        type: choice
        options:
          - opened
          - draft
          - ready
          - approve
          - approve1
          - changes
          - merge
          - reviewer-added

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Get Project and Field IDs
        id: get-project-info
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DATABASE_PROJECT_WORKFLOW_TOKEN }}
          script: |
            const projectNumber = 3;
            const owner = context.repo.owner;

            // Get project ID and fields
            const projectQuery = `
              query($owner: String!, $number: Int!) {
                organization(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 20) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options {
                            id
                            name
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const projectData = await github.graphql(projectQuery, {
              owner,
              number: projectNumber
            });

            const project = projectData.organization.projectV2;

            // Find Status and Review Status fields
            const statusField = project.fields.nodes.find(f => f.name === 'Status');
            const reviewStatusField = project.fields.nodes.find(f => f.name === 'Review Status');

            return {
              projectId: project.id,
              statusField: {
                id: statusField.id,
                options: {
                  'In Progress': statusField.options.find(o => o.name === 'In Progress').id,
                  'In Review': statusField.options.find(o => o.name === 'In Review').id,
                  'In Testing': statusField.options.find(o => o.name === 'In Testing').id,
                  'Done': statusField.options.find(o => o.name === 'Done').id
                }
              },
              reviewStatusField: {
                id: reviewStatusField.id,
                options: {
                  'Waiting': reviewStatusField.options.find(o => o.name === 'Waiting').id,
                  'Feedback': reviewStatusField.options.find(o => o.name === 'Feedback').id,
                  'Merge': reviewStatusField.options.find(o => o.name === 'Merge').id
                }
              }
            };

      - name: Update PR and Issue Status
        if: github.event_name != 'pull_request_review'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DATABASE_PROJECT_WORKFLOW_TOKEN }}
          script: |
            const projectInfo = ${{ steps.get-project-info.outputs.result }};

            // Handle workflow_dispatch differently
            let pr, eventType;
            if (context.eventName === 'workflow_dispatch') {
              const prNumber = ${{ github.event.inputs.pr_number || 0 }};
              eventType = '${{ github.event.inputs.action || '' }}';

              // Fetch PR data
              const prQuery = `
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      id
                      number
                      title
                      state
                      isDraft
                    }
                  }
                }
              `;

              const prData = await github.graphql(prQuery, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: prNumber
              });

              pr = {
                node_id: prData.repository.pullRequest.id,
                number: prData.repository.pullRequest.number,
                title: prData.repository.pullRequest.title
              };

              console.log(`Manual test: Processing "${eventType}" for PR #${pr.number}`);
            } else {
              pr = context.payload.pull_request;
              eventType = context.payload.action;
              console.log(`Processing ${eventType} event for PR #${pr.number}`);
            }

            // Helper function to get project item ID for an issue or PR
            async function getProjectItem(contentId) {
              const query = `
                query($contentId: ID!) {
                  node(id: $contentId) {
                    ... on Issue {
                      projectItems(first: 10) {
                        nodes {
                          id
                          project { id }
                        }
                      }
                    }
                    ... on PullRequest {
                      projectItems(first: 10) {
                        nodes {
                          id
                          project { id }
                        }
                      }
                    }
                  }
                }
              `;

              const result = await github.graphql(query, {
                contentId
              });

              const item = result.node.projectItems.nodes.find(
                i => i.project.id === projectInfo.projectId
              );

              return item ? item.id : null;
            }

            // Helper function to add item to project if not already there
            async function ensureInProject(contentId) {
              let itemId = await getProjectItem(contentId);

              if (!itemId) {
                console.log(`Adding item to project...`);
                const addMutation = `
                  mutation($projectId: ID!, $contentId: ID!) {
                    addProjectV2ItemById(input: {
                      projectId: $projectId
                      contentId: $contentId
                    }) {
                      item { id }
                    }
                  }
                `;

                const result = await github.graphql(addMutation, {
                  projectId: projectInfo.projectId,
                  contentId: contentId
                });

                itemId = result.addProjectV2ItemById.item.id;
              }

              return itemId;
            }

            // Helper function to update field value
            async function updateFieldValue(itemId, fieldId, optionId) {
              const mutation = `
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: ProjectV2FieldValue!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: $value
                  }) {
                    projectV2Item { id }
                  }
                }
              `;

              await github.graphql(mutation, {
                projectId: projectInfo.projectId,
                itemId: itemId,
                fieldId: fieldId,
                value: { singleSelectOptionId: optionId }
              });
            }

            // Helper function to clear field value
            async function clearFieldValue(itemId, fieldId) {
              const mutation = `
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!) {
                  clearProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                  }) {
                    projectV2Item { id }
                  }
                }
              `;

              await github.graphql(mutation, {
                projectId: projectInfo.projectId,
                itemId: itemId,
                fieldId: fieldId
              });
            }

            // Helper function to get linked issues
            async function getLinkedIssues(prNumber) {
              const query = `
                query($owner: String!, $repo: String!, $prNumber: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $prNumber) {
                      closingIssuesReferences(first: 10) {
                        nodes {
                          id
                          number
                          title
                        }
                      }
                    }
                  }
                }
              `;

              const result = await github.graphql(query, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                prNumber: prNumber
              });

              return result.repository.pullRequest.closingIssuesReferences.nodes;
            }

            // Ensure PR is in the project
            const prItemId = await ensureInProject(pr.node_id);
            console.log(`PR item ID: ${prItemId}`);

            // Get linked issues - we'll only update the first one if multiple exist
            const linkedIssues = await getLinkedIssues(pr.number);
            console.log(`Found ${linkedIssues.length} linked issues`);
            const linkedIssue = linkedIssues.length > 0 ? linkedIssues[0] : null;
            if (linkedIssue) {
              console.log(`Will update issue #${linkedIssue.number}: ${linkedIssue.title}`);
            }

            // Handle different event types
            if (eventType === 'opened' || eventType === 'reopened' || eventType === 'converted_to_draft') {
              // Set PR and linked issue to "In Progress"
              // Clear Review Status since status is not In Review or In Testing
              console.log('Setting status to In Progress and clearing Review Status');
              await updateFieldValue(
                prItemId,
                projectInfo.statusField.id,
                projectInfo.statusField.options['In Progress']
              );
              await clearFieldValue(
                prItemId,
                projectInfo.reviewStatusField.id
              );

              // Update linked issue if it exists
              if (linkedIssue) {
                const issueItemId = await ensureInProject(linkedIssue.id);
                await updateFieldValue(
                  issueItemId,
                  projectInfo.statusField.id,
                  projectInfo.statusField.options['In Progress']
                );
                console.log(`Updated issue #${linkedIssue.number} to In Progress`);
              }
            }

            if (eventType === 'ready_for_review') {
              // Set PR to "In Review" and Review Status to "Waiting"
              console.log('Setting PR to In Review with Review Status: Waiting');
              await updateFieldValue(
                prItemId,
                projectInfo.statusField.id,
                projectInfo.statusField.options['In Review']
              );
              await updateFieldValue(
                prItemId,
                projectInfo.reviewStatusField.id,
                projectInfo.reviewStatusField.options['Waiting']
              );

              // Update linked issue if it exists
              if (linkedIssue) {
                const issueItemId = await ensureInProject(linkedIssue.id);
                await updateFieldValue(
                  issueItemId,
                  projectInfo.statusField.id,
                  projectInfo.statusField.options['In Review']
                );
                console.log(`Updated issue #${linkedIssue.number} to In Review`);
              }
            }

            if (eventType === 'review_requested') {
              // When a new reviewer is added, check current status
              // Get current field values
              const itemQuery = `
                query($contentId: ID!) {
                  node(id: $contentId) {
                    ... on PullRequest {
                      projectItems(first: 10) {
                        nodes {
                          id
                          project { id }
                          fieldValues(first: 20) {
                            nodes {
                              ... on ProjectV2ItemFieldSingleSelectValue {
                                field {
                                  ... on ProjectV2SingleSelectField {
                                    id
                                    name
                                  }
                                }
                                name
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `;

              const itemData = await github.graphql(itemQuery, {
                contentId: pr.node_id
              });

              const projectItem = itemData.node.projectItems.nodes.find(
                i => i.project.id === projectInfo.projectId
              );

              if (projectItem) {
                const reviewStatusValue = projectItem.fieldValues.nodes.find(
                  fv => fv.field && fv.field.name === 'Review Status'
                );

                console.log(`Current Review Status: ${reviewStatusValue ? reviewStatusValue.name : 'None'}`);

                // If Review Status was "Merge", reset to "In Testing" and "Waiting"
                if (reviewStatusValue && reviewStatusValue.name === 'Merge') {
                  console.log('New reviewer added to PR with Merge status - resetting to In Testing + Waiting');
                  await updateFieldValue(
                    prItemId,
                    projectInfo.statusField.id,
                    projectInfo.statusField.options['In Testing']
                  );
                  await updateFieldValue(
                    prItemId,
                    projectInfo.reviewStatusField.id,
                    projectInfo.reviewStatusField.options['Waiting']
                  );

                  // Update linked issue if it exists
                  if (linkedIssue) {
                    const issueItemId = await ensureInProject(linkedIssue.id);
                    await updateFieldValue(
                      issueItemId,
                      projectInfo.statusField.id,
                      projectInfo.statusField.options['In Testing']
                    );
                    console.log(`Updated issue #${linkedIssue.number} to In Testing`);
                  }
                }
              }
            }

            // Manual test actions for workflow_dispatch
            if (eventType === 'draft') {
              // Same as opened
              console.log('[TEST] Setting status to In Progress and clearing Review Status');
              await updateFieldValue(
                prItemId,
                projectInfo.statusField.id,
                projectInfo.statusField.options['In Progress']
              );
              await clearFieldValue(
                prItemId,
                projectInfo.reviewStatusField.id
              );

              if (linkedIssue) {
                const issueItemId = await ensureInProject(linkedIssue.id);
                await updateFieldValue(
                  issueItemId,
                  projectInfo.statusField.id,
                  projectInfo.statusField.options['In Progress']
                );
                console.log(`Updated issue #${linkedIssue.number} to In Progress`);
              }
            }

            if (eventType === 'ready') {
              // Same as ready_for_review
              console.log('[TEST] Setting PR to In Review with Review Status: Waiting');
              await updateFieldValue(
                prItemId,
                projectInfo.statusField.id,
                projectInfo.statusField.options['In Review']
              );
              await updateFieldValue(
                prItemId,
                projectInfo.reviewStatusField.id,
                projectInfo.reviewStatusField.options['Waiting']
              );

              if (linkedIssue) {
                const issueItemId = await ensureInProject(linkedIssue.id);
                await updateFieldValue(
                  issueItemId,
                  projectInfo.statusField.id,
                  projectInfo.statusField.options['In Review']
                );
                console.log(`Updated issue #${linkedIssue.number} to In Review`);
              }
            }

            if (eventType === 'approve1') {
              // Single reviewer approved
              console.log('[TEST] Single reviewer approved - Status: In Review, Review Status: Merge');
              await updateFieldValue(
                prItemId,
                projectInfo.reviewStatusField.id,
                projectInfo.reviewStatusField.options['Merge']
              );
            }

            if (eventType === 'approve') {
              // First of multiple reviewers approved
              console.log('[TEST] First of multiple reviewers approved - Status: In Testing, Review Status: Waiting');
              await updateFieldValue(
                prItemId,
                projectInfo.statusField.id,
                projectInfo.statusField.options['In Testing']
              );
              await updateFieldValue(
                prItemId,
                projectInfo.reviewStatusField.id,
                projectInfo.reviewStatusField.options['Waiting']
              );

              if (linkedIssue) {
                const issueItemId = await ensureInProject(linkedIssue.id);
                await updateFieldValue(
                  issueItemId,
                  projectInfo.statusField.id,
                  projectInfo.statusField.options['In Testing']
                );
                console.log(`Updated issue #${linkedIssue.number} to In Testing`);
              }
            }

            if (eventType === 'changes') {
              // Changes requested
              console.log('[TEST] Changes requested - Status: In Progress, Review Status: Feedback');
              await updateFieldValue(
                prItemId,
                projectInfo.statusField.id,
                projectInfo.statusField.options['In Progress']
              );
              await updateFieldValue(
                prItemId,
                projectInfo.reviewStatusField.id,
                projectInfo.reviewStatusField.options['Feedback']
              );

              if (linkedIssue) {
                const issueItemId = await ensureInProject(linkedIssue.id);
                await updateFieldValue(
                  issueItemId,
                  projectInfo.statusField.id,
                  projectInfo.statusField.options['In Progress']
                );
                console.log(`Updated issue #${linkedIssue.number} to In Progress`);
              }
            }

            if (eventType === 'merge') {
              // All reviewers approved
              console.log('[TEST] All reviewers approved - Review Status: Merge');
              await updateFieldValue(
                prItemId,
                projectInfo.reviewStatusField.id,
                projectInfo.reviewStatusField.options['Merge']
              );
            }

            if (eventType === 'reviewer-added') {
              // New reviewer added
              console.log('[TEST] New reviewer added - Status: In Testing, Review Status: Waiting');
              await updateFieldValue(
                prItemId,
                projectInfo.statusField.id,
                projectInfo.statusField.options['In Testing']
              );
              await updateFieldValue(
                prItemId,
                projectInfo.reviewStatusField.id,
                projectInfo.reviewStatusField.options['Waiting']
              );

              if (linkedIssue) {
                const issueItemId = await ensureInProject(linkedIssue.id);
                await updateFieldValue(
                  issueItemId,
                  projectInfo.statusField.id,
                  projectInfo.statusField.options['In Testing']
                );
                console.log(`Updated issue #${linkedIssue.number} to In Testing`);
              }
            }

      - name: Handle Review Submission
        if: github.event_name == 'pull_request_review'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DATABASE_PROJECT_WORKFLOW_TOKEN }}
          script: |
            const projectInfo = ${{ steps.get-project-info.outputs.result }};
            const pr = context.payload.pull_request;
            const review = context.payload.review;

            console.log(`Processing review ${review.state.toUpperCase()} for PR #${pr.number}`);

            // Helper functions (same as above)
            async function getProjectItem(contentId) {
              const query = `
                query($contentId: ID!) {
                  node(id: $contentId) {
                    ... on Issue {
                      projectItems(first: 10) {
                        nodes {
                          id
                          project { id }
                        }
                      }
                    }
                    ... on PullRequest {
                      projectItems(first: 10) {
                        nodes {
                          id
                          project { id }
                        }
                      }
                    }
                  }
                }
              `;

              const result = await github.graphql(query, {
                contentId
              });

              const item = result.node.projectItems.nodes.find(
                i => i.project.id === projectInfo.projectId
              );

              return item ? item.id : null;
            }

            async function ensureInProject(contentId) {
              let itemId = await getProjectItem(contentId);

              if (!itemId) {
                const addMutation = `
                  mutation($projectId: ID!, $contentId: ID!) {
                    addProjectV2ItemById(input: {
                      projectId: $projectId
                      contentId: $contentId
                    }) {
                      item { id }
                    }
                  }
                `;

                const result = await github.graphql(addMutation, {
                  projectId: projectInfo.projectId,
                  contentId: contentId
                });

                itemId = result.addProjectV2ItemById.item.id;
              }

              return itemId;
            }

            async function updateFieldValue(itemId, fieldId, optionId) {
              const mutation = `
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: ProjectV2FieldValue!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: $value
                  }) {
                    projectV2Item { id }
                  }
                }
              `;

              await github.graphql(mutation, {
                projectId: projectInfo.projectId,
                itemId: itemId,
                fieldId: fieldId,
                value: { singleSelectOptionId: optionId }
              });
            }

            async function clearFieldValue(itemId, fieldId) {
              const mutation = `
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!) {
                  clearProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                  }) {
                    projectV2Item { id }
                  }
                }
              `;

              await github.graphql(mutation, {
                projectId: projectInfo.projectId,
                itemId: itemId,
                fieldId: fieldId
              });
            }

            async function getLinkedIssues(prNumber) {
              const query = `
                query($owner: String!, $repo: String!, $prNumber: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $prNumber) {
                      closingIssuesReferences(first: 10) {
                        nodes {
                          id
                          number
                          title
                        }
                      }
                    }
                  }
                }
              `;

              const result = await github.graphql(query, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                prNumber: prNumber
              });

              return result.repository.pullRequest.closingIssuesReferences.nodes;
            }

            // Get all reviews for the PR
            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            // Get latest review from each reviewer
            const latestReviews = {};
            for (const r of reviews.data) {
              if (!latestReviews[r.user.login] || new Date(r.submitted_at) > new Date(latestReviews[r.user.login].submitted_at)) {
                latestReviews[r.user.login] = r;
              }
            }

            const reviewStates = Object.values(latestReviews).map(r => r.state);
            const approvedCount = reviewStates.filter(s => s === 'APPROVED').length;
            const changesRequestedCount = reviewStates.filter(s => s === 'CHANGES_REQUESTED').length;
            const commentedCount = reviewStates.filter(s => s === 'COMMENTED').length;

            console.log(`Reviews: ${approvedCount} approved, ${changesRequestedCount} changes requested, ${commentedCount} commented`);

            const prItemId = await ensureInProject(pr.node_id);
            const linkedIssues = await getLinkedIssues(pr.number);
            const linkedIssue = linkedIssues.length > 0 ? linkedIssues[0] : null;

            if (linkedIssue) {
              console.log(`Will update issue #${linkedIssue.number}`);
            }

            // Get total number of reviewers (requested reviewers)
            const prDetails = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            const requestedReviewers = prDetails.data.requested_reviewers.length;
            const totalReviewers = Object.keys(latestReviews).length + requestedReviewers;

            console.log(`Total reviewers: ${totalReviewers}, Approved: ${approvedCount}, Requested: ${requestedReviewers}`);

            // Normalize review state to uppercase for consistent comparison
            const reviewState = review.state.toUpperCase();

            // Determine status based on reviews
            if (reviewState === 'CHANGES_REQUESTED' || reviewState === 'COMMENTED') {
              // Any review that's not approval sets Status to "In Progress" and Review Status to "Feedback"
              console.log('Setting Status to In Progress and Review Status to Feedback (changes requested or commented)');
              await updateFieldValue(
                prItemId,
                projectInfo.statusField.id,
                projectInfo.statusField.options['In Progress']
              );
              await updateFieldValue(
                prItemId,
                projectInfo.reviewStatusField.id,
                projectInfo.reviewStatusField.options['Feedback']
              );

              // Update linked issue if it exists
              if (linkedIssue) {
                const issueItemId = await ensureInProject(linkedIssue.id);
                await updateFieldValue(
                  issueItemId,
                  projectInfo.statusField.id,
                  projectInfo.statusField.options['In Progress']
                );
                console.log(`Updated issue #${linkedIssue.number} to In Progress`);
              }
            } else if (reviewState === 'APPROVED') {
              // Check how many reviewers total
              if (totalReviewers === 1 && approvedCount === 1) {
                // Only one reviewer and they approved - Status stays "In Review", Review Status to "Merge"
                console.log('Single reviewer approved - Status: In Review, Review Status: Merge');
                await updateFieldValue(
                  prItemId,
                  projectInfo.reviewStatusField.id,
                  projectInfo.reviewStatusField.options['Merge']
                );
              } else if (totalReviewers >= 2 && approvedCount === 1) {
                // Multiple reviewers, first approval - Status to "In Testing", Review Status to "Waiting"
                console.log('First of multiple reviewers approved - Status: In Testing, Review Status: Waiting');
                await updateFieldValue(
                  prItemId,
                  projectInfo.statusField.id,
                  projectInfo.statusField.options['In Testing']
                );
                await updateFieldValue(
                  prItemId,
                  projectInfo.reviewStatusField.id,
                  projectInfo.reviewStatusField.options['Waiting']
                );

                // Update linked issue if it exists
                if (linkedIssue) {
                  const issueItemId = await ensureInProject(linkedIssue.id);
                  await updateFieldValue(
                    issueItemId,
                    projectInfo.statusField.id,
                    projectInfo.statusField.options['In Testing']
                  );
                  console.log(`Updated issue #${linkedIssue.number} to In Testing`);
                }
              } else if (approvedCount === totalReviewers && totalReviewers >= 2) {
                // All reviewers approved - Review Status to "Merge"
                console.log('All reviewers approved - Review Status: Merge');
                await updateFieldValue(
                  prItemId,
                  projectInfo.reviewStatusField.id,
                  projectInfo.reviewStatusField.options['Merge']
                );
              }
            }
