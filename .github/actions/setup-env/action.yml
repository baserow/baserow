name: 'Setup Environment Variables'
description: 'Sets up shared environment variables for CI workflows'

outputs:
  registry:
    description: 'Docker registry URL'
    value: 'ghcr.io'
  image-repo:
    description: 'Image repository name'
    value: ${{ github.repository }}
  ci-image-tag-prefix:
    description: 'Prefix for CI image tags'
    value: 'ci-'
  develop-branch:
    description: 'Name of the develop branch'
    value: 'develop'

runs:
  using: 'composite'
  steps:
    - name: Set environment variables
      shell: bash
      run: |
        echo "REGISTRY=ghcr.io" >> $GITHUB_ENV
        echo "IMAGE_REPO=${{ github.repository }}" >> $GITHUB_ENV
        echo "CI_IMAGE_TAG_PREFIX=ci-" >> $GITHUB_ENV
        echo "DEVELOP_BRANCH_NAME=develop" >> $GITHUB_ENV
